<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab:hover {
            background: #f5f5f5;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            background: #f9f9f9;
            cursor: pointer;
        }
        
        input[type="file"]:hover {
            background: #f0f0f0;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result.real {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .result.fake {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .result h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .result .confidence {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .result .probabilities {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .loading {
            text-align: center;
            display: none;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Fake News Detector</h1>
            <p>Enter news text or upload a file to check if it's REAL or FAKE</p>
        </div>
        
        <div class="content">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('text')">📝 Text Input</div>
                <div class="tab" onclick="switchTab('file')">📁 File Upload</div>
            </div>
            
            <!-- Text Input Tab -->
            <div id="text-tab" class="tab-content active">
                <div class="form-group">
                    <label for="news-text">Enter News Article Text:</label>
                    <textarea id="news-text" placeholder="Paste your news article text here..."></textarea>
                </div>
                <button class="btn" onclick="predictText()">Detect Fake News</button>
            </div>
            
            <!-- File Upload Tab -->
            <div id="file-tab" class="tab-content">
                <div class="info">
                    Supported formats: PDF, TXT, CSV
                </div>
                <div class="form-group">
                    <label for="file-input">Upload File:</label>
                    <input type="file" id="file-input" accept=".pdf,.txt,.csv">
                </div>
                <button class="btn" onclick="predictFile()">Detect from File</button>
            </div>
            
            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">Analyzing...</p>
            </div>
            
            <!-- Error -->
            <div id="error" class="error"></div>
            
            <!-- Result -->
            <div id="result" class="result">
                <h2 id="result-label"></h2>
                <div class="confidence">Confidence: <span id="result-confidence"></span></div>
                <div class="probabilities">
                    <div>REAL Probability: <span id="result-real"></span></div>
                    <div>FAKE Probability: <span id="result-fake"></span></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentTab = 'text';
        
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab UI
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tab === 'text') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('text-tab').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('file-tab').classList.add('active');
            }
            
            // Hide result
            hideResult();
        }
        
        function hideResult() {
            document.getElementById('result').classList.remove('show');
            document.getElementById('error').classList.remove('show');
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            document.getElementById('result').classList.remove('show');
            document.getElementById('loading').classList.remove('show');
        }
        
        function showResult(data) {
            const resultEl = document.getElementById('result');
            resultEl.classList.remove('real', 'fake');
            
            if (data.prediction === 'REAL') {
                resultEl.classList.add('real');
            } else {
                resultEl.classList.add('fake');
            }
            
            document.getElementById('result-label').textContent = 
                data.prediction === 'REAL' ? '✅ REAL NEWS' : '❌ FAKE NEWS';
            document.getElementById('result-confidence').textContent = data.confidence;
            document.getElementById('result-real').textContent = data.real_probability;
            document.getElementById('result-fake').textContent = data.fake_probability;
            
            resultEl.classList.add('show');
            document.getElementById('loading').classList.remove('show');
            document.getElementById('error').classList.remove('show');
        }
        
        async function predictText() {
            const text = document.getElementById('news-text').value.trim();
            
            if (!text) {
                showError('Please enter some text to analyze.');
                return;
            }
            
            hideResult();
            document.getElementById('loading').classList.add('show');
            
            const formData = new FormData();
            formData.append('text', text);
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data);
                } else {
                    showError(data.error || 'An error occurred.');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        }
        
        async function predictFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('Please select a file to upload.');
                return;
            }
            
            hideResult();
            document.getElementById('loading').classList.add('show');
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data);
                } else {
                    showError(data.error || 'An error occurred.');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        }
    </script>
</body>
</html>
